# Local stack: Kafka (KRaft) + Postgres (logical replication) + Debezium + Flink + notifier + mailpit.
# Build jars first:  ./gradlew build -x test
# Then:              docker compose -f deploy/docker-compose.yml up --build
name: chargemon

x-db-env: &db-env
  DB_URL: jdbc:postgresql://postgres:5432/chargemon
  DB_USER: chargemon
  DB_PASSWORD: chargemon

services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh; B=kafka:19092
        $$K --bootstrap-server $$B --create --if-not-exists --topic common-broker --partitions 8
        $$K --bootstrap-server $$B --create --if-not-exists --topic alerts --partitions 4
        $$K --bootstrap-server $$B --create --if-not-exists --topic alerts-dlq --partitions 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic dead-letter --partitions 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic late-events --partitions 1
        for t in stations groups rules; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions 4 --config cleanup.policy=compact --config min.compaction.lag.ms=600000
        done
        $$K --bootstrap-server $$B --list

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: chargemon
      POSTGRES_USER: chargemon
      POSTGRES_PASSWORD: chargemon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargemon"]
      interval: 3s
      timeout: 3s
      retries: 30

  schema:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.java-app
      args: { JAR: schema/build/libs/schema-all.jar }
    depends_on:
      postgres: { condition: service_healthy }
    environment: *db-env
    restart: "no"

  connect:
    image: quay.io/debezium/connect:3.1
    depends_on:
      kafka: { condition: service_healthy }
      schema: { condition: service_completed_successfully }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: chargemon-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  connector-init:
    image: curlimages/curl:8.12.1
    depends_on:
      connect: { condition: service_healthy }
    volumes: ["./debezium:/debezium:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -sf -X PUT -H 'Content-Type: application/json' \
          --data @/debezium/rules-connector.json http://connect:8083/connectors/rules-cdc/config
        echo; curl -s http://connect:8083/connectors/rules-cdc/status

  jobmanager:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.flink
    command: standalone-job --job-classname com.chargemon.flink.JobMain
    ports: ["8081:8081"]
    depends_on:
      topic-init: { condition: service_completed_successfully }
      schema: { condition: service_completed_successfully }
    environment:
      <<: *db-env
      KAFKA_BOOTSTRAP: kafka:19092
      PARALLELISM: "2"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.interval: 30s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  taskmanager:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.flink
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      <<: *db-env
      KAFKA_BOOTSTRAP: kafka:19092
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  notifier:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.java-app
      args: { JAR: notifier/build/libs/notifier.jar }
    depends_on:
      topic-init: { condition: service_completed_successfully }
      schema: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chargemon
      SPRING_DATASOURCE_USERNAME: chargemon
      SPRING_DATASOURCE_PASSWORD: chargemon
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      NOTIFIER_FALLBACK_CRITICAL: email:ops@example.test
      NOTIFIER_FALLBACK_HIGH: email:ops@example.test
      NOTIFIER_FALLBACK_DEFAULT: email:ops@example.test

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    ports: ["8090:8080"]
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
